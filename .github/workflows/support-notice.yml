name: Check localized support notice
on:
  pull_request:
    paths: ['support_notice.py', 'tests/test_support_notice.py', '.github/workflows/support-notice.yml', '**/*.py']
permissions:
  contents: read
jobs:
  support-notice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_support_notice.py -v
      - run: python -m compileall -q .
