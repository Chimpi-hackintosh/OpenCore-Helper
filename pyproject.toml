[project]
name = "opencore-helper"
version = "3.0.1"
description = "Windows and macOS OpenCore workspace and CustomTkinter plist editor"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
